spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
          routes:
            - id: publisher
              uri: lb://publisher
              predicates:
                - Path=/api/v1/orders/**

            - id: subscriber
              uri: lb://subscriber
              predicates:
                - Path=/api/v1/notifications/**

            - id: dashboard
              uri: http://localhost:3001/dashboard
              predicates:
                - Path=/dashboard/**

            - id: web
              uri: http://localhost:3000
              predicates:
                - Path=/**